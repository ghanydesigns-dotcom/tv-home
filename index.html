<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
    color: #f5f5f7;
    background: #0b0b0f;
    -webkit-font-smoothing: antialiased;
  }
  #bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 20% 0%, #1c2433 0%, #0b0b0f 60%);
    -webkit-transition: background 4s ease; transition: background 4s ease;
  }
  .wrap {
    position: relative; width: 100%; height: 100%;
    padding: 5vw 6vw 4.5vw;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
  }
  .top {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-box-align: start; -webkit-align-items: flex-start; align-items: flex-start;
  }
  .label {
    font-size: 1.05vw; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(245,245,247,0.45);
  }
  /* Clock */
  #clock { font-size: 13vw; font-weight: 200; letter-spacing: -0.04em; line-height: 0.95; }
  #ampm { font-size: 2.4vw; font-weight: 300; color: rgba(245,245,247,0.5); margin-left: 0.6vw; letter-spacing: 0; }
  #date { font-size: 2vw; font-weight: 300; margin-top: 1.4vw; color: rgba(245,245,247,0.85); }
  /* Weather */
  .weather { text-align: right; }
  .wx-row {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: end; -webkit-justify-content: flex-end; justify-content: flex-end;
    margin-top: 1vw;
  }
  #wxIcon { width: 5vw; height: 5vw; margin-right: 1.4vw; }
  #wxIcon svg { width: 100%; height: 100%; }
  #temp { font-size: 6.5vw; font-weight: 200; letter-spacing: -0.03em; line-height: 1; }
  #cond { font-size: 1.8vw; font-weight: 300; margin-top: 0.8vw; }
  #wxMeta { font-size: 1.25vw; font-weight: 300; margin-top: 0.6vw; color: rgba(245,245,247,0.5); }
  /* Prayers */
  .next { margin-bottom: 2vw; }
  #nextName { font-size: 2.6vw; font-weight: 300; margin-top: 0.6vw; }
  #nextIn { color: rgba(245,245,247,0.5); }
  .prayers {
    display: -webkit-box; display: -webkit-flex; display: flex;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 1.6vw; overflow: hidden;
  }
  .p {
    -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
    padding: 1.6vw 0; text-align: center;
    border-right: 1px solid rgba(255,255,255,0.06);
    -webkit-transition: background 0.6s; transition: background 0.6s;
  }
  .p:last-child { border-right: 0; }
  .p .n { font-size: 1.15vw; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(245,245,247,0.45); }
  .p .t { font-size: 2.3vw; font-weight: 300; margin-top: 0.5vw; }
  .p.past .t { color: rgba(245,245,247,0.35); }
  .p.active { background: rgba(255,255,255,0.14); }
  .p.active .n { color: #f5f5f7; }
  .footer {
    margin-top: 1.2vw; font-size: 0.95vw; color: rgba(245,245,247,0.28);
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
  }
  .brand { font-weight: 500; letter-spacing: 0.08em; color: rgba(245,245,247,0.4); }
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <div class="top">
    <div>
      <div><span id="clock">--:--</span><span id="ampm"></span></div>
      <div id="date"></div>
    </div>
    <div class="weather">
      <div class="label">Alexandria</div>
      <div class="wx-row"><div id="wxIcon"></div><div id="temp">--°</div></div>
      <div id="cond">Loading weather…</div>
      <div id="wxMeta"></div>
    </div>
  </div>

  <div>
    <div class="next">
      <div class="label">Next prayer</div>
      <div id="nextName">— <span id="nextIn"></span></div>
    </div>
    <div class="prayers" id="prayers"></div>
    <div class="footer"><span id="status">Updating…</span><span class="brand">G2C Home TV V.1.0</span></div>
  </div>
</div>

<script>
(function () {
  var LAT = 31.2001, LON = 29.9187;
  var CITY = "Alexandria", COUNTRY = "Egypt", METHOD = 5; // 5 = Egyptian General Authority of Survey
  var ORDER = ["Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha"];
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  var prayers = null, prayerDay = -1;

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function getJSON(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { ok(JSON.parse(x.responseText)); } catch (e) { fail && fail(); }
      } else { fail && fail(); }
    };
    x.ontimeout = function () { fail && fail(); };
    x.send();
  }

  function to12(h, m) {
    var ap = h >= 12 ? "PM" : "AM";
    var hh = h % 12; if (hh === 0) hh = 12;
    return { t: hh + ":" + pad(m), ap: ap };
  }

  /* ---------- Clock ---------- */
  function tickClock() {
    var d = new Date();
    var c = to12(d.getHours(), d.getMinutes());
    $("clock").innerHTML = c.t;
    $("ampm").innerHTML = c.ap;
    $("date").innerHTML = DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
    updateBackground(d.getHours());
    if (prayers) updateNext(d);
    if (d.getDate() !== prayerDay && d.getHours() >= 0 && prayers) loadPrayers();
  }

  function updateBackground(h) {
    var g;
    if (h >= 5 && h < 8) g = "radial-gradient(ellipse at 20% 0%, #3a2a3f 0%, #0b0b0f 60%)";
    else if (h >= 8 && h < 16) g = "radial-gradient(ellipse at 20% 0%, #1f3348 0%, #0b0b0f 62%)";
    else if (h >= 16 && h < 19) g = "radial-gradient(ellipse at 20% 0%, #3d2a22 0%, #0b0b0f 60%)";
    else g = "radial-gradient(ellipse at 20% 0%, #161b2a 0%, #0b0b0f 60%)";
    if ($("bg").getAttribute("data-g") !== g) {
      $("bg").style.background = g;
      $("bg").setAttribute("data-g", g);
    }
  }

  /* ---------- Weather ---------- */
  var ICONS = {
    sun: '<svg viewBox="0 0 48 48" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linecap="round"><circle cx="24" cy="24" r="8"/><path d="M24 6v4M24 38v4M6 24h4M38 24h4M11.3 11.3l2.8 2.8M33.9 33.9l2.8 2.8M11.3 36.7l2.8-2.8M33.9 14.1l2.8-2.8"/></svg>',
    moon: '<svg viewBox="0 0 48 48" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linejoin="round"><path d="M34 30a13 13 0 0 1-16-16 13 13 0 1 0 16 16z"/></svg>',
    partly: '<svg viewBox="0 0 48 48" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="17" r="6"/><path d="M18 5v2M7 17H5M10 9l1.4 1.4M26 9l-1.4 1.4"/><path d="M16 38h18a7 7 0 0 0 0-14 10 10 0 0 0-19 3 5.5 5.5 0 0 0 1 11z" fill="#0b0b0f"/></svg>',
    cloud: '<svg viewBox="0 0 48 48" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linejoin="round"><path d="M14 36h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3.5A6.3 6.3 0 0 0 14 36z"/></svg>',
    rain: '<svg viewBox="0 0 48 48" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 30h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3.5A6.3 6.3 0 0 0 14 30z"/><path d="M17 35l-2 5M25 35l-2 5M33 35l-2 5"/></svg>',
    storm: '<svg viewBox="0 0 48 48" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 30h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3.5A6.3 6.3 0 0 0 14 30z"/><path d="M25 32l-4 6h6l-4 6"/></svg>',
    fog: '<svg viewBox="0 0 48 48" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linecap="round"><path d="M10 20h28M8 27h32M12 34h24"/></svg>'
  };

  function describe(code, isDay) {
    if (code === 0) return { t: "Clear", i: isDay ? "sun" : "moon" };
    if (code === 1 || code === 2) return { t: code === 1 ? "Mostly clear" : "Partly cloudy", i: isDay ? "partly" : "cloud" };
    if (code === 3) return { t: "Cloudy", i: "cloud" };
    if (code === 45 || code === 48) return { t: "Fog", i: "fog" };
    if (code >= 51 && code <= 57) return { t: "Drizzle", i: "rain" };
    if (code >= 61 && code <= 67) return { t: "Rain", i: "rain" };
    if (code >= 80 && code <= 82) return { t: "Showers", i: "rain" };
    if (code >= 95) return { t: "Thunderstorm", i: "storm" };
    return { t: "—", i: "cloud" };
  }

  function loadWeather() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
      "&daily=temperature_2m_max,temperature_2m_min&timezone=Africa%2FCairo";
    getJSON(url, function (j) {
      var c = j.current, d = j.daily;
      var w = describe(c.weather_code, c.is_day === 1);
      $("temp").innerHTML = Math.round(c.temperature_2m) + "°";
      $("cond").innerHTML = w.t;
      $("wxIcon").innerHTML = ICONS[w.i];
      $("wxMeta").innerHTML = "H " + Math.round(d.temperature_2m_max[0]) + "°  ·  L " +
        Math.round(d.temperature_2m_min[0]) + "°  ·  Humidity " + c.relative_humidity_2m + "%";
      stamp();
    }, function () {
      $("cond").innerHTML = "Weather unavailable";
      setTimeout(loadWeather, 60000);
    });
  }

  /* ---------- Prayer times ---------- */
  function loadPrayers() {
    var d = new Date();
    var url = "https://api.aladhan.com/v1/timingsByCity/" + pad(d.getDate()) + "-" + pad(d.getMonth() + 1) + "-" + d.getFullYear() +
      "?city=" + CITY + "&country=" + COUNTRY + "&method=" + METHOD;
    prayerDay = d.getDate();
    getJSON(url, function (j) {
      var t = j.data.timings;
      prayers = [];
      for (var i = 0; i < ORDER.length; i++) {
        var raw = t[ORDER[i]].substring(0, 5).split(":");
        prayers.push({ name: ORDER[i], h: parseInt(raw[0], 10), m: parseInt(raw[1], 10) });
      }
      renderPrayers();
      updateNext(new Date());
      stamp();
    }, function () {
      prayerDay = -1;
      $("status").innerHTML = "Prayer times unavailable — retrying";
      setTimeout(loadPrayers, 60000);
    });
  }

  function renderPrayers() {
    var html = "";
    for (var i = 0; i < prayers.length; i++) {
      var p = to12(prayers[i].h, prayers[i].m);
      html += '<div class="p" id="p' + i + '"><div class="n">' + prayers[i].name +
        '</div><div class="t">' + p.t + '</div></div>';
    }
    $("prayers").innerHTML = html;
  }

  function updateNext(d) {
    var now = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
    var next = -1;
    for (var i = 0; i < prayers.length; i++) {
      var el = $("p" + i);
      var mins = prayers[i].h * 60 + prayers[i].m;
      if (next === -1 && mins > now) next = i;
      if (el) el.className = "p" + (mins <= now ? " past" : "");
    }
    var diff, idx;
    if (next === -1) { idx = 0; diff = 1440 - now + prayers[0].h * 60 + prayers[0].m; }
    else { idx = next; diff = prayers[idx].h * 60 + prayers[idx].m - now; }
    var activeEl = $("p" + idx);
    if (activeEl) activeEl.className = "p active";
    var hrs = Math.floor(diff / 60), mn = Math.floor(diff % 60);
    var inTxt = hrs > 0 ? "in " + hrs + "h " + mn + "m" : "in " + mn + " min";
    $("nextName").innerHTML = prayers[idx].name + ' <span id="nextIn">' + inTxt + "</span>";
  }

  function stamp() {
    var d = new Date(), c = to12(d.getHours(), d.getMinutes());
    $("status").innerHTML = "Updated " + c.t + " " + c.ap;
  }

  /* ---------- Start ---------- */
  tickClock();
  loadWeather();
  loadPrayers();
  setInterval(tickClock, 1000);
  setInterval(loadWeather, 15 * 60 * 1000);
})();
</script>
</body>
</html>
